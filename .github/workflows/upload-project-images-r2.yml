name: Upload Bauhu project WebP images to R2

on:
  push:
    branches:
      - feature/exuma-r2-gallery
    paths:
      - '.github/workflows/upload-project-images-r2.yml'
      - 'assets/r2-projects/exuma-waterfront/**'
  workflow_dispatch:
    inputs:
      connection_test:
        description: "Verify bucket access without uploading"
        required: true
        default: true
        type: boolean
      project_slug:
        description: "Project folder under assets/r2-projects (e.g. exuma-waterfront)"
        required: false
        default: exuma-waterfront
        type: string
      dry_run:
        description: "Validate only; do not upload"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: r2-project-images-${{ inputs.project_slug || 'exuma-waterfront' }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check R2 connection
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.connection_test }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws s3 ls "s3://$BUCKET/" --endpoint-url "https://$ACCOUNT_ID.r2.cloudflarestorage.com"
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'push' || !inputs.connection_test }}
      - name: Publish WebP previews into website assets
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          mkdir -p public/images/project-gallery/exuma-waterfront
          cp assets/r2-projects/exuma-waterfront/*.webp public/images/project-gallery/exuma-waterfront/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/project-gallery/exuma-waterfront/
          if ! git diff --cached --quiet; then
            git commit -m "Publish Exuma Waterfront preview images"
            git push
          fi
      - name: Validate staged images
        if: ${{ github.event_name == 'push' || !inputs.connection_test }}
        id: validate
        env:
          SLUG: ${{ inputs.project_slug || 'exuma-waterfront' }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          slug = os.environ["SLUG"]
          if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", slug):
              raise SystemExit("Invalid project slug")
          source = Path("assets/r2-projects") / slug
          if not source.is_dir():
              raise SystemExit(f"Missing staged project folder: {source}")
          images = sorted(source.glob("*.webp"))
          if not images:
              raise SystemExit(f"No WebP images found in {source}")
          for path in images:
              with path.open("rb") as image:
                  header = image.read(12)
              if header[:4] != b"RIFF" or header[8:12] != b"WEBP":
                  raise SystemExit(f"Invalid WebP: {path}")
          print(f"Validated {len(images)} WebP images for {slug}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"source={source}\n")
              output.write(f"prefix=projects/{slug}/\n")
          PY
      - name: Show planned keys
        if: ${{ github.event_name == 'push' || !inputs.connection_test }}
        env:
          SOURCE: ${{ steps.validate.outputs.source }}
          PREFIX: ${{ steps.validate.outputs.prefix }}
        run: |
          echo "R2 keys:"
          find "$SOURCE" -maxdepth 1 -type f -name '*.webp' -printf "$PREFIX%f\n" | sort
      - name: Upload images to Cloudflare R2
        if: ${{ github.event_name == 'push' || (!inputs.connection_test && inputs.dry_run == false) }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SOURCE: ${{ steps.validate.outputs.source }}
          PREFIX: ${{ steps.validate.outputs.prefix }}
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing R2 credential or bucket: $name"
              exit 1
            fi
          done
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          for file in "$SOURCE"/*.webp; do
            name="$(basename "$file")"
            aws s3 cp "$file" "s3://${R2_BUCKET}/${PREFIX}${name}" \
              --endpoint-url "$endpoint" \
              --content-type "image/webp" \
              --cache-control "public, max-age=31536000, immutable" \
              --no-progress
            aws s3api head-object \
              --bucket "$R2_BUCKET" \
              --key "${PREFIX}${name}" \
              --endpoint-url "$endpoint" > /dev/null
            echo "Verified: ${PREFIX}${name}"
          done
